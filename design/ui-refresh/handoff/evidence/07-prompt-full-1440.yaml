    - article:
      - img "file-text"
      - strong: 故事卡
      - text: 原始剧本
      - paragraph: 雨后的一天，农村的水泥路面还没有干透，到处都是积水。 一名穿着粉紫色短袖的年轻小伙，骑着粉红色小电动车，慢悠悠地行驶在村里的道路上。 就在他经过一户人家门口时，一名穿黑衣服的年轻男子突然从旁边走过来，叫住了他。 黑衣男子手里拿着一根细树枝，神神秘秘地凑上前，示意骑车小伙闻一闻或者尝一尝。 骑车小伙有些疑惑，扭头看着黑衣男子，随后突然皱起眉头，脸上露出非常嫌弃的表情。 他忍不住大声说道： “这啥呀？咋恁臭啊！” 黑衣男子见状，立即接话，带着一种“我早就告诉过你”的语气说道： “看，我说你踩住屎了吧！你还不信！” 说完，黑衣男子转身朝道路另一侧走去。 镜头跟随他移动，发现不远处还有一名扎着马尾的年轻女子。 女子正弯着腰，手里拿着一根长木棍，不断拨弄湿漉漉的路面，似乎在检查地上的某样东西。 黑衣男子快步走到女子身边，也低头查看地面。 两个人站在积水旁，一个拿着细树枝，一个拿着长木棍，注意力都集中在脚下。 故事在两人查看路面的画面中结束。
      - button "查看／编辑原剧本"
