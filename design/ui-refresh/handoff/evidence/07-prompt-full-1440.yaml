      - text: 当前使用 302 字 远景，固定机位，沿道路纵深平视取景，9:16画幅。第3张参考图作为场景基准，雨后阴天柔和漫射自然光铺满画面，路面布满深浅不一的积水洼，水面倒映灰蒙蒙的天光，画面左侧露出浅黄墙面、红对联的民居一角，弯曲的村道向画面深处延伸。 画面中下方偏远处，第1张参考图的噜噜身着粉紫色短袖，端正坐在第2张参考图的粉色小电动车上，双手扶着车把，身体微微向前，正沿着湿漉漉的村道慢悠悠向前骑行。噜噜眼神平视前方路面，表情松弛平静，没有惊讶或疑惑神态，电动车车轮靠近一处浅水坑，整车姿态平稳，还没有抵达民居门口。 画面里没有其他角色，道路两侧零星长着低矮小草，远处是朦胧的田埂植被，整体氛围安静，呈现雨后乡村道路的初始状态。
