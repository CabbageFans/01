      - text: 当前使用 356 字 首帧采用@图片1，尾帧采用@图片2，9:16画幅，远景，固定机位，沿道路纵深平视，黏土短绒毛毡3D卡通质感，雨后阴天柔和漫射自然光，路面遍布积水洼，水面倒映灰蒙天光，画面左侧是带红对联的浅黄民居墙体，村道向画面深处延伸。噜噜是金黄大头圆胖水豚，橙色宽圆吻部，头顶带小橘子，身穿粉紫色短袖，端正坐在@图片1同款粉色小电动车上，双手握住车把，从画面远处沿道路中线匀速缓慢向前骑行，车身随湿软坑洼路面轻微上下颠簸起伏，视线一直平视前方路面，神态松弛平静，没有额外表情变化。车轮持续碾过浅水洼，缓慢由远及近向前移动，直至骑行抵达民居门口点位，车身减速刹停，车轮停在门前浅水坑旁，头部转向画面左侧民居门口方向，保持即将被黑衣男子叫住的终态，全程没有其他角色入画。<车轮碾过积水的轻微沙沙水声>，全程无字幕、无对白文字叠加。
