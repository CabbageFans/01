        - text: 全文
      - text: 当前使用 384 字 以第1张参考图（本镜首帧）作为编辑基准，9:16画幅，中景，固定侧方平视机位，保留原首帧的阴天雨后柔和漫射自然光、光影均匀柔和，保留雨后积水乡村水泥村道场景，背景保留民居墙面、木门与红对联，路面浅水洼、路边零星低矮小草、向后方弯曲延伸的村道全部不变，全程维持黏土短绒毛毡卡通质感。 保持噜噜身份造型不变，噜噜依旧坐在粉色小电动车上，电动车静止停在民居门前水坑边，双手搭在车把，保留骑行坐姿；修改为头部完全转向噜妹方向，视线落在噜妹前伸的细树枝上，面部呈现疑惑神态，尚未出现皱眉嫌弃表情。 保持噜妹身份造型不变，依旧站在电动车左前方、面向噜噜；修改为右臂向前伸出，右手握持细树枝，将枝条递送到噜噜身前位置，树枝处于两人中间，神态保持神秘，视线看向噜噜。 粉色小电动车、细树枝的外形材质与首帧一致，机位、取景范围、空间锚点不发生改变，不新增角色、道具、文字与额外剧情元素。
